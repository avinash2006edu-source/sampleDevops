
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- script: |
    chmod +x gradlew
    ./gradlew clean build
  displayName: 'Build Java Gradle Application'

- script: |
    ./gradlew run
  displayName: 'Run Gradle Application'
